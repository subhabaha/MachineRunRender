# config.yaml

# Streamlit configuration
streamlit:
  page_title: "Machine Status App"
  page_icon: "🤖"
  layout: "wide"

# Model and video configuration
model:
  model_path: "machine_model_5jan10pm.h5"
  video_path: "${VIDEO_PATH}"  # set VIDEO_PATH env var, e.g. rtsp://user:pass@host:554/...

# Email configuration
email:
  sender_email: "chandrapaulcs2001@gmail.com"
  sender_password: "${GMAIL_APP_PASSWORD}"  # set GMAIL_APP_PASSWORD env var
  recipient_email: "chandrapauldas01@gmail.com"
  email_subject: "⚠️ Warning! Machine Status changed ⚠️"

# Streamlit sidebar options
sidebar:
  menu_title: "Main Menu"
  options:
    - "Machine Status"
    - "Machine runtime log"
  icons:
    - "lightning-charge-fill"
    - "list-columns"
  default_index: 0